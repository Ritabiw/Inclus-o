<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="title"> JOGO DA ESCOLHA </h1></title>
  <link rel="stylesheet" href="../../hy.css">
  <!-- Carregando React, ReactDOM e Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #ffffff;
    padding: 20px;
  }
  .game-container {
    text-align: center;
  }
  .color-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  .color-button {
    width: 120px;
    height: 120px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s, transform 0.1s;
  }
  .color-button.active {
    opacity: 1;
    transform: scale(1.15);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    border: 4px solid #ffc107;
  }
  .start-btn {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    background-color: #3498db;
    color: white;
    border-radius: 5px;
  }
</style>
<body>
    <div class="title">
        <h1>JOGO DA ESCOLHA</h1>
    </div>

  <div id="root"></div>
  

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COLORS = [
      { id: 'blue', hex: '#4A90E2', label: 'Azul' },
      { id: 'green', hex: '#7ED321', label: 'Verde' },
      { id: 'yellow', hex: '#F5A623', label: 'Amarelo' },
      { id: 'red', hex: '#D0021B', label: 'Vermelho' }
    ];

    const ColorGame = () => {
      const [sequence, setSequence] = useState([]);
      const [userSequence, setUserSequence] = useState([]);
      const [activeColor, setActiveColor] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [message, setMessage] = useState('Clique em Iniciar');

      // Inicia um novo jogo ou próxima fase
      const startGame = () => {
        const nextPhase = sequence.length + 1;
        // Fases 1 a 3 usam 2 cores. Fases 4 a 9 usam 4 cores.
        const availableColors = nextPhase <= 3 ? COLORS.slice(0, 2) : COLORS;
        const nextColor = availableColors[Math.floor(Math.random() * availableColors.length)].id;
        const newSequence = [...sequence, nextColor];
        setSequence(newSequence);
        setUserSequence([]);
        playSequence(newSequence);
      };

      // Reproduz a sequência visualmente
      const playSequence = (seq) => {
        setIsPlaying(true);
        seq.forEach((colorId, index) => {
          setTimeout(() => {
            setActiveColor(colorId);
            setTimeout(() => setActiveColor(null), 1000); // Cor brilha por 1 segundo (mais lento)
          }, (index + 1) * 1500); // 1.5s de intervalo entre cada piscada
        });
        setTimeout(() => {
          setIsPlaying(false);
          setMessage('Sua vez!');
        }, (seq.length * 1500) + 1500);
      };

      // Lida com o clique do usuário
      const handleColorClick = (colorId) => {
        // Bloqueia cliques se a máquina estiver jogando ou se o jogo não tiver começado
        if (isPlaying || sequence.length === 0) return;

        // Pisca a cor brevemente para confirmar o clique do usuário
        setActiveColor(colorId);
        setTimeout(() => setActiveColor(null), 250);

        const newUserSequence = [...userSequence, colorId];
        setUserSequence(newUserSequence);

        // Verifica se errou
        const currentIndex = newUserSequence.length - 1;
        if (newUserSequence[currentIndex] !== sequence[currentIndex]) {
          setMessage('Ops! Vamos tentar novamente.');
          setUserSequence([]); // Zera apenas a tentativa
          setTimeout(() => playSequence(sequence), 2000); // Repete a MESMA sequência para não frustrar
          return;
        }

        // Verifica se completou a sequência
        if (newUserSequence.length === sequence.length) {
          // Toca o som de aplausos ao concluir a fase
          const somAplausos = new Audio('https://www.soundjay.com/human/sounds/applause-01.mp3'); 
          somAplausos.play().catch(erro => console.log("Áudio bloqueado:", erro));

          if (sequence.length === 6) { // Reduzido de 9 para 6 fases totais
            setMessage('Parabéns! Você completou todas as fases!');
            setTimeout(() => {
              setSequence([]);
              setUserSequence([]);
              setMessage('Clique em Iniciar');
            }, 3500);
          } else {
            setMessage(`Muito bem! Preparando fase ${sequence.length + 1}...`);
            setTimeout(startGame, 1000);
          }
        }
      };

      // Determina quais cores renderizar na tela com base na fase atual
      const currentPhase = sequence.length === 0 ? 1 : sequence.length;
      let visibleColors = COLORS.slice(0, 2);
      if (currentPhase >= 3 && currentPhase <= 4) visibleColors = COLORS.slice(0, 3);
      if (currentPhase >= 5) visibleColors = COLORS;

      return (
        <div className="game-container">
          <h2>{message}</h2>
          <div className="color-grid">
            {visibleColors.map((color) => (
              <button
                key={color.id}
                className={`color-button ${activeColor === color.id ? 'active' : ''}`}
                style={{ backgroundColor: color.hex }}
                onClick={() => handleColorClick(color.id)}
                aria-label={color.label}
              />
            ))}
          </div>
          {sequence.length === 0 && (
            <button className="start-btn" onClick={startGame}>Iniciar Jogo</button>
          )}
        </div>
      );
    };

    // Renderiza a aplicação no DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ColorGame />);
  </script>
</body>
</html>
