<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../hy.css">
    <title>Jogo da Memória</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 5px; }
        #level-indicator { margin-bottom: 20px; color: #3498db; }
        
        #game-board {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }
        
        .card {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            display: flex;
            
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            user-select: none;
            box-shadow: 0 4px 6px rgba(128, 121, 121, 0.3);
            overflow: hidden;
    
        }
        
        .card img {
            width: 80%;
            height: 80%;
             object-fit: cover;
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }

        .card.flipped {
            background-color: #ecf0f1;
            cursor: default;
            transform: scale(1.05);
        }
        
        .card.flipped img {
            display: block;
        }
        
        .card.matched {
            background-color: #2ecc71;
            cursor: default;
            transform: scale(1);
            box-shadow: 0 0 10px #2ecc71;
        }

        .card.matched img {
            display: block;
            opacity: 0.8;
        }
        
        #message {
            margin-top: 25px;
            font-size: 1.2em;
            font-weight: bold;
            color: #000000;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>JOGO DA MEMÓRIA</h1>
    </div>
    <h2 id="level-indicator">Fase: 1 / 12</h2>
    <div id="game-board"></div>
    <div id="message"></div>

    <script>
        // Substitua os textos abaixo pelos caminhos ou URLs das suas próprias fotos.
        const images = [
            'photos/monica.jpg',
            'photos/cebolinha.jpg',
            'photos/cascao.jpg',
            'photos/magali.jpg',
            'photos/melancia.jpg',
            'photos/ama.jpg',
            'photos/coelho.jpg',
            'photos/bidu.jpg',
            'photos/ana.jpg',
            'photos/su.jpg'
        ];
        let currentLevel = 1;
        const totalLevels = 12;
        let pairsNeeded = 0;
        let flippedCards = [];
        let matchedPairs = 0;
        let isLocked = false;

        const board = document.getElementById('game-board');
        const levelIndicator = document.getElementById('level-indicator');
        const message = document.getElementById('message');

        function getPairsForLevel(level) {
            if (level <= 3) return 1;       // Fases 1 a 3: 1 par
            if (level <= 9) return 2;       // Fases 4 a 9: 2 pares
            return 3;                       // Fases 10 a 12: 3 pares
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initLevel() {
            if (currentLevel > totalLevels) {
                board.innerHTML = '';
                message.style.color = '#2ecc71';
                message.textContent = '🎉 Parabéns! Você completou todas as 12 fases do jogo!';
                return;
            }

            pairsNeeded = getPairsForLevel(currentLevel);
            matchedPairs = 0;
            flippedCards = [];
            isLocked = true;
            message.textContent = 'Memorize as cartas...';
            levelIndicator.textContent = `Fase: ${currentLevel} / ${totalLevels} (${pairsNeeded} ${pairsNeeded === 1 ? 'par' : 'pares'})`;

            // Define quantas colunas o grid terá de acordo com a quantidade total de cartas (pares * 2)
            const totalCards = pairsNeeded * 2;
            const columns = Math.ceil(Math.sqrt(totalCards));
            
            // Ajusta a largura máxima do tabuleiro dinamicamente para as cartas não ficarem gigantes no PC
            board.style.maxWidth = `${columns * 140 + (columns - 1) * 10}px`; 
            // 1fr faz as colunas se espremerem e dividirem o espaço na tela do celular perfeitamente!
            board.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

            // Seleciona fotos aleatórias para esta fase e duplica para formar os pares
            const levelImages = shuffle([...images]).slice(0, pairsNeeded);
            const cards = shuffle([...levelImages, ...levelImages]);

            // Renderiza as cartas
            board.innerHTML = '';
            cards.forEach(imageSrc => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.classList.add('flipped');
                card.dataset.image = imageSrc;
                
                const img = document.createElement('img');
                img.src = imageSrc;
                card.appendChild(img);
                
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
            
            // Esconde as cartas após 1 segundo
            setTimeout(() => {
                const allCards = document.querySelectorAll('.card');
                allCards.forEach(c => c.classList.remove('flipped'));
                isLocked = false;
                message.textContent = '';
            }, 1000);
        }

        function flipCard(card) {
            // Impede cliques duplos, cliques em cartas já viradas ou se o tabuleiro estiver travado
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.image === card2.dataset.image) {
                // Encontrou um par
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                isLocked = false;

                if (matchedPairs === pairsNeeded) {
                    // Toca o som de aplausos ao concluir a fase
                    const somAplausos = new Audio('https://www.soundjay.com/human/sounds/applause-01.mp3'); 
                    somAplausos.play().catch(erro => console.log("Áudio bloqueado:", erro));

                    message.textContent = 'Muito bem! Carregando a próxima fase...';
                    setTimeout(() => {
                        currentLevel++;
                        initLevel();
                    }, 1500);
                }
            } else {
                // Errou o par
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        // Inicia o jogo na fase 1
        initLevel();
    </script>
</body>
</html>
