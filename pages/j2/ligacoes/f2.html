<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Connect the Colors - Visual Match</title>
    <link rel="stylesheet" href="../hy.css">
    <style>
        
        @font-face {
    font-family: 'Coiny';
    /* Certifique-se de que o nome do arquivo abaixo é exatamente o mesmo que você baixou na sua pasta */
    src: url('../../../Coiny/Coiny-Regular.ttf') format('truetype'); 
}

    
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #181818;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Coiny', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none; 
        }
        #ui-topo {
            position: absolute;
            top: 1%; 
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 10;
            align-items: center;
        }
        #instrucao {
            font-size: clamp(14px, 3vw, 24px); 
            font-weight: bold;
            background-color: #222;
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid #444;
            display: inline-block;
            letter-spacing: 2px;
            color: #ddd;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #tela-fim {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 20px;
        }
        .btn {
            font-size: clamp(18px, 4vw, 24px);
            font-family: 'Coiny', sans-serif;
            background-color: #3498db;
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s, background-color 0.3s;
            width: 80%;
            max-width: 350px;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-topo">
        <div id="instrucao">CONNECT COLORS</div>
    </div>
    
    <!-- Tela de Fim de Jogo -->
    <div id="tela-fim">
        <button id="btn-jogar" class="btn">Jogar novamente</button>
        <button id="btn-inicio" class="btn">Início</button>
    </div>


    <canvas id="gameCanvas"></canvas>

    <!-- Elemento de áudio escondido. Certifique-se de ter um arquivo 'fundo.mp3' na mesma pasta -->
    <audio id="bgMusic" loop>
        <source src="corescone.mp3" type="audio/mpeg">
    </audio>

    <!-- Elemento de áudio para o efeito de acerto -->
    <audio id="sfxMoeda">
        <source src="coin.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const bgMusic = document.getElementById("bgMusic");
        const sfxMoeda = document.getElementById("sfxMoeda");
        let musicaIniciada = false;

        // Carrega a imagem da moeda
        const imgMoeda = new Image();
        imgMoeda.src = "coin.png";

        // Tabela de Cores com Cores de Contraste (Para o texto não sumir quando a caixa colorir)
        const todasCores = [
            { nome: "BLUE", hex: "#0055FF", contraste: "#FFFFFF" },
            { nome: "RED", hex: "#FF3333", contraste: "#FFFFFF" },
            { nome: "YELLOW", hex: "#FFFF00", contraste: "#000000" },
            { nome: "GREEN", hex: "#00FF44", contraste: "#000000" },
            { nome: "PURPLE", hex: "#AA00FF", contraste: "#FFFFFF" },
            { nome: "PINK", hex: "#FF66CC", contraste: "#000000" },
            { nome: "ORANGE", hex: "#FF8800", contraste: "#000000" },
            { nome: "WHITE", hex: "#FFFFFF", contraste: "#000000" }
        ];

        let bolinhas = [];
        let palavras = [];
        let conexoes = [];
        let moedasAnimacao = []; // Guarda as moedas que estão aparecendo

        let arrastando = false;
        let noOrigem = null;
        let dedoX = 0;
        let dedoY = 0;

        const fases = [2, 2, 3, 3, 3, 4, 4, 4]; // 2 de 2, 3 de 3, e 3 de 4
        let faseAtual = 0;

        function embaralhar(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function atualizarTamanhosEPosicoes() {
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);

            const largura = window.innerWidth;
            const altura = window.innerHeight;

            const medidaBase = Math.min(largura, altura);
            
            const margemEsquerda = largura < 500 ? largura * 0.15 : largura * 0.25;
            const margemDireita = largura < 500 ? largura * 0.75 : largura * 0.75;
            
            const espacoY = bolinhas.length > 0 ? altura / (bolinhas.length + 1) : altura / 4; 

            for (let i = 0; i < bolinhas.length; i++) {
                bolinhas[i].x = margemEsquerda;
                bolinhas[i].y = espacoY * (i + 1);
                bolinhas[i].raio = Math.min(medidaBase * 0.08, 45); 
            }

            for (let i = 0; i < palavras.length; i++) {
                palavras[i].x = margemDireita;
                palavras[i].y = espacoY * (i + 1);
                palavras[i].largura = Math.min(largura * 0.35, 200); 
                palavras[i].altura = Math.min(altura * 0.12, 80);
            }
        }

        window.addEventListener('resize', atualizarTamanhosEPosicoes);

        function iniciarRodada() {
            conexoes = [];
            bolinhas = [];
            palavras = [];
            moedasAnimacao = [];
            arrastando = false;
            noOrigem = null;

            let numCores = fases[faseAtual];
            let coresSorteadas = embaralhar([...todasCores]).slice(0, numCores);
            let ordemBolinhas = embaralhar([...coresSorteadas]);
            let ordemPalavras = embaralhar([...coresSorteadas]);

            for (let i = 0; i < numCores; i++) {
                bolinhas.push({
                    corHex: ordemBolinhas[i].hex,
                    nomeCor: ordemBolinhas[i].nome,
                    conectado: false
                });

                palavras.push({
                    corHex: ordemPalavras[i].hex,
                    nomeCor: ordemPalavras[i].nome,
                    contraste: ordemPalavras[i].contraste, // Salva a cor de contraste
                    conectado: false
                });
            }

            atualizarTamanhosEPosicoes();
        }

        function atualizarPosicaoDedo(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dedoX = clientX - rect.left;
            dedoY = clientY - rect.top;
        }

        function iniciarToque(e) {
            e.preventDefault();
            atualizarPosicaoDedo(e);

            // Inicia a música na primeira interação do jogador para evitar bloqueio do navegador
            if (!musicaIniciada) {
                bgMusic.volume = 0.3; // Define o volume (0.0 a 1.0, 0.3 é 30%)
                bgMusic.play().catch(err => console.log("Aguardando interação...", err));
                musicaIniciada = true;
            }

            for (let bola of bolinhas) {
                const dx = dedoX - bola.x;
                const dy = dedoY - bola.y;
                const distancia = Math.sqrt(dx * dx + dy * dy);

                if (distancia < bola.raio * 1.8 && !bola.conectado) {
                    arrastando = true;
                    noOrigem = bola;
                    break;
                }
            }
        }

        function moverToque(e) {
            if (arrastando) {
                e.preventDefault();
                atualizarPosicaoDedo(e);
            }
        }

        function encerrarToque(e) {
            if (arrastando && noOrigem) {
                for (let palavra of palavras) {
                    const margemErro = 40;
                    if (!palavra.conectado &&
                        dedoX > (palavra.x - palavra.largura/2 - margemErro) &&
                        dedoX < (palavra.x + palavra.largura/2 + margemErro) &&
                        dedoY > (palavra.y - palavra.altura/2 - margemErro) &&
                        dedoY < (palavra.y + palavra.altura/2 + margemErro)) {
                        
                        if (noOrigem.nomeCor === palavra.nomeCor) {
                            noOrigem.conectado = true;
                            palavra.conectado = true;
                            
                            conexoes.push({
                                origem: noOrigem,
                                destino: palavra,
                                cor: noOrigem.corHex
                            });

                            // Toca o som de acerto
                            sfxMoeda.currentTime = 0; // Reinicia o som caso o jogador acerte rápido
                            sfxMoeda.volume = 0.5;
                            sfxMoeda.play().catch(err => console.log("Erro ao tocar som: ", err));

                            // Adiciona a moeda para animação na posição da palavra
                            moedasAnimacao.push({ x: palavra.x, y: palavra.y - 20, alpha: 1.0, subida: 0 });

                            if (conexoes.length === fases[faseAtual]) {
                                if (faseAtual < fases.length - 1) {
                                    faseAtual++; // Avança para a próxima etapa
                                    setTimeout(iniciarRodada, 1500);
                                } else {
                                    setTimeout(mostrarTelaFim, 1500); // Mostra a tela final se não houver mais etapas
                                }
                            }
                        }
                    }
                }
            }
            arrastando = false;
            noOrigem = null;
        }

        canvas.addEventListener("touchstart", iniciarToque, { passive: false });
        canvas.addEventListener("touchmove", moverToque, { passive: false });
        canvas.addEventListener("touchend", encerrarToque);
        
        canvas.addEventListener("mousedown", iniciarToque);
        canvas.addEventListener("mousemove", moverToque);
        canvas.addEventListener("mouseup", encerrarToque);

        function desenhar() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Linhas Conectadas
            ctx.lineWidth = Math.max(window.innerWidth * 0.02, 8);
            ctx.lineCap = "round";
            for (let linha of conexoes) {
                ctx.beginPath();
                ctx.moveTo(linha.origem.x, linha.origem.y);
                ctx.lineTo(linha.destino.x, linha.destino.y);
                ctx.strokeStyle = linha.cor;
                ctx.stroke();
            }

            // Linha sendo arrastada
            if (arrastando && noOrigem) {
                ctx.beginPath();
                ctx.moveTo(noOrigem.x, noOrigem.y);
                ctx.lineTo(dedoX, dedoY);
                ctx.strokeStyle = noOrigem.corHex;
                ctx.lineWidth = Math.max(window.innerWidth * 0.02, 8);
                ctx.stroke();
            }

            // Bolinhas
            for (let bola of bolinhas) {
                ctx.beginPath();
                ctx.arc(bola.x, bola.y, bola.raio, 0, Math.PI * 2);
                ctx.fillStyle = bola.corHex;
                ctx.fill();
                
                ctx.lineWidth = 4;
                ctx.strokeStyle = bola.conectado ? "#FFF" : "#333";
                ctx.stroke();
            }

            // Caixas de Palavras
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let palavra of palavras) {
                const x = palavra.x - palavra.largura / 2;
                const y = palavra.y - palavra.altura / 2;

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, y, palavra.largura, palavra.altura, 15);
                } else {
                    ctx.rect(x, y, palavra.largura, palavra.altura);
                }
                
                ctx.fillStyle = palavra.conectado ? palavra.corHex : "#222";
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = palavra.conectado ? "#FFF" : "#555";
                ctx.stroke();

                // Tamanho da fonte dinâmico
                const fontSize = Math.min(palavra.largura * 0.15, palavra.altura * 0.35);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;

                // TEXTO: Recebe a cor da bolinha ANTES de conectar, ou a cor de contraste APÓS conectar!
                if (palavra.conectado) {
                    ctx.fillStyle = palavra.contraste; 
                } else {
                    ctx.fillStyle = palavra.corHex; 
                }
                
                // Desenha o texto apenas uma vez com limite de largura
                ctx.fillText(palavra.nomeCor, palavra.x, palavra.y, palavra.largura - 10);
            }

            // Desenhar as moedas subindo
            for (let i = moedasAnimacao.length - 1; i >= 0; i--) {
                let moeda = moedasAnimacao[i];
                
                ctx.save();
                ctx.globalAlpha = moeda.alpha; // Aplica transparência progressiva
                
                // Desenha a imagem da moeda (tamanho 40x40 pixels, centralizada)
                const tamanhoMoeda = 40;
                ctx.drawImage(imgMoeda, moeda.x - tamanhoMoeda / 2, moeda.y - moeda.subida - tamanhoMoeda / 2, tamanhoMoeda, tamanhoMoeda);
                
                ctx.restore();

                moeda.subida += 1.5;   // Velocidade que a moeda sobe
                moeda.alpha -= 0.02;   // Velocidade que a moeda desaparece

                if (moeda.alpha <= 0) {
                    moedasAnimacao.splice(i, 1); // Remove a moeda quando fica invisível
                }
            }

            requestAnimationFrame(desenhar);
        }

        function mostrarTelaFim() {
            canvas.style.display = "none";
            document.getElementById("ui-topo").style.display = "none";
            document.getElementById("tela-fim").style.display = "flex";
        }

        document.getElementById("btn-jogar").addEventListener("click", () => {
            canvas.style.display = "block";
            document.getElementById("ui-topo").style.display = "block";
            document.getElementById("tela-fim").style.display = "none";
            faseAtual = 0; // Zera as fases para jogar do início
            iniciarRodada();
        });

        document.getElementById("btn-inicio").addEventListener("click", () => {
            window.top.location.href = "../../../index.html"; 
        });

        iniciarRodada();
        desenhar();
    </script>
</body>
</html>
