<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../hy.css">
    <title>Jogo da Memória</title>
    <style>
        @font-face {
            font-family: 'Coiny';
            src: url('../../Coiny/Coiny-Regular.ttf') format('truetype'); 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { 
            margin-bottom: 5px; 
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }
        #level-indicator { margin-bottom: 0; color: #000000; }
        
        #game-board {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            position: relative;
        }
        
        #game-board.loading::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background-color: rgba(0, 0, 0, 0.756);
            z-index: 10;
            border-radius: 15px;
        }
        
        .card {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            display: flex;
            
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            user-select: none;
            box-shadow: 0 4px 6px rgba(128, 121, 121, 0.3);
            overflow: hidden;
    
        }
        
        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: none;
            pointer-events: none;
            padding: 5px;
        }

        .card.flipped {
            background-color: #ecf0f1;
            cursor: default;
            transform: scale(1.05);
        }
        
        .card.flipped img {
            display: block;
        }
        
        .card.matched {
            background-color: #2ecc71;
            cursor: default;
            transform: scale(1);
            box-shadow: 0 0 10px #2ecc71;
        }

        .card.matched img {
            opacity: 0.8;
        }
        
        #message {
            margin-top: 20px;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            width: max-content;
            max-width: 90%;
            font-size: 1rem;
            font-weight: bold;
            color: #ffd700;
            background-color: rgba(0, 0, 0, 0.85);
            text-align: center;
            pointer-events: none;
        }

        #message:empty {
            display: none !important;
        }
        
        .btn {
            font-size: clamp(18px, 4vw, 24px);
            font-family: 'Coiny', sans-serif;
            background-color: #3498db;
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s, background-color 0.3s;
            width: 80%;
            max-width: 350px;
            text-align: center;
            display: block;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    <div class="title" >
        <h1>JOGO DA MEMÓRIA</h1>
    </div>
    <h2 id="level-indicator">Fase 1</h2>
    <div id="message"></div>
    <div id="game-board"></div>
    <div id="botoes-fim" style="display: none; flex-direction: column; align-items: center; width: 100%; gap: 15px; margin-top: 30px;">
        <button class="btn" onclick="resetGame()">Jogar novamente</button>
        <button id="btn-inicio" class="btn" onclick="goHome()">Início</button>
    </div>

    <script>
        // Substitua os textos abaixo pelos caminhos ou URLs das suas próprias fotos.
        const images = [
            'photos/bode.jpg',
            'photos/cachorro.jpg',
            'photos/cobra.jpg',
            'photos/elefante.jpg',
            'photos/formiga.jpg',
            'photos/galinha.jpg',
            'photos/gato.jpg',
            'photos/girafa.jpg',
            'photos/jumento.jpg',
            'photos/leao.jpg',
            'photos/macaco.jpg',
            'photos/passaro.jpg',
            'photos/peixe.jpg',
            'photos/porco.jpg',
            'photos/rato.jpg',
            'photos/sapo.jpg',
            'photos/tartaruga.jpg',
            'photos/tubarao.jpg',
            'photos/vaca.jpg',
            'photos/zebra.jpg'
        ];
        let currentLevel = 1;
        let displayPhase = 1; // Variável que controla a fase mostrada na tela
        const totalLevels = 12;
        let pairsNeeded = 0;
        let flippedCards = [];
        let matchedPairs = 0;
        let isLocked = false;

        // Instancia os áudios uma única vez para evitar sobrecarga de memória
        const somAcerto = new Audio('../j1/acerto.mp3');
        const somConquista = new Audio('../j1/conquista.mp3');

        const board = document.getElementById('game-board');
        const levelIndicator = document.getElementById('level-indicator');
        const message = document.getElementById('message');

        function getPairsForLevel(level) {
            if (level <= 3) return 1;       // Fases 1 a 3: 1 par
            if (level <= 9) return 2;       // Fases 4 a 9: 2 pares
            return 3;                       // Fases 10 a 12: 3 pares
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initLevel() {
            board.classList.remove('loading'); // Garante que a camada seja removida ao iniciar a fase
            
            if (currentLevel > totalLevels) {
                board.innerHTML = '';
                levelIndicator.style.display = 'none'; // Esconde o indicador de Fase
                message.style.color = '#2ecc71';
                message.style.pointerEvents = 'auto'; // Reativa os cliques dentro da div message
                message.innerHTML = `<div>🎉 Parabéns! Você completou o jogo!</div>`;
                document.getElementById('botoes-fim').style.display = 'flex';
                return;
            }

            pairsNeeded = getPairsForLevel(currentLevel);
            matchedPairs = 0;
            flippedCards = [];
            isLocked = true;
            message.textContent = `Atenção para a Fase ${displayPhase}!`;
            levelIndicator.textContent = `Fase ${displayPhase}`;

            // Define quantas colunas o grid terá de acordo com a quantidade total de cartas (pares * 2)
            const totalCards = pairsNeeded * 2;
            const columns = Math.ceil(Math.sqrt(totalCards));
            
            // Ajusta a largura máxima do tabuleiro dinamicamente para as cartas não ficarem gigantes no PC
            board.style.maxWidth = `${columns * 140 + (columns - 1) * 10}px`; 
            // 1fr faz as colunas se espremerem e dividirem o espaço na tela do celular perfeitamente!
            board.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

            // Seleciona fotos aleatórias para esta fase e duplica para formar os pares
            const levelImages = shuffle([...images]).slice(0, pairsNeeded);
            const cards = shuffle([...levelImages, ...levelImages]);

            // Renderiza as cartas
            board.innerHTML = '';
            cards.forEach(imageSrc => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.image = imageSrc;
                
                const img = document.createElement('img');
                img.src = imageSrc;
                card.appendChild(img);
                
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
            
            // Transição: Mostra o alerta por 1.5s antes de revelar as cartas
            setTimeout(() => {
                message.textContent = 'MEMORIZE OS CARDS...';
                const allCards = document.querySelectorAll('.card');
                allCards.forEach(c => c.classList.add('flipped')); // Vira as cartas
                
                // Esconde as cartas após 2.5 segundos
                setTimeout(() => {
                    allCards.forEach(c => c.classList.remove('flipped'));
                    isLocked = false;
                    message.textContent = '';
                }, 2500);
            }, 1500);
        }

        function flipCard(card) {
            // Impede cliques duplos, cliques em cartas já viradas ou se o tabuleiro estiver travado
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.image === card2.dataset.image) {
                // Encontrou um par
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                isLocked = false;

                // Toca som de acerto toda vez que acertar um par
                somAcerto.currentTime = 0; // Reinicia o som para tocar novamente se necessário
                somAcerto.play().catch(erro => console.log("Áudio bloqueado:", erro));

                if (matchedPairs === pairsNeeded) {
                    // Toca o som de conquista ao concluir um bloco de fases (fases 3, 9 e 12)
                    if (currentLevel === 3 || currentLevel === 9 || currentLevel === 12) {
                        somConquista.currentTime = 0;
                        somConquista.play().catch(erro => console.log("Áudio bloqueado:", erro));
                        displayPhase++; // Atualiza a fase visual apenas quando toca a conquista
                    }

                    message.innerHTML = ''; // Limpa a caixa de mensagens
                    board.insertAdjacentHTML('beforeend', `<iframe src="../j1/relogio.html" width="80" height="80" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; border:none; overflow:hidden; background:transparent;" allowtransparency="true" scrolling="no" pointer-events="none"></iframe>`);
                  
                    board.classList.add('loading'); // Ativa a camada por cima dos cards
                    
                    setTimeout(() => {
                        currentLevel++;
                        initLevel();
                    }, 3000);
                }
            } else {
                // Errou o par
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        function resetGame() {
            currentLevel = 1;
            displayPhase = 1;
            levelIndicator.style.display = 'block'; // Mostra novamente a fase
            message.style.pointerEvents = 'none'; // Bloqueia cliques na mensagem de novo
            message.style.color = '#ffd700'; // Volta a cor amarela original
            document.getElementById('botoes-fim').style.display = 'none';
            initLevel();
        }

        function goHome() {
            window.top.location.href = '../../index.html'; 
        }

        // Inicia o jogo na fase 1
        initLevel();
    </script>
</body>
</html>
